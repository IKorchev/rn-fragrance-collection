# Post-picker interstitial: closing the picker modal after a spin shows an
# AdMob interstitial (Google's test ad in dev builds — see src/lib/ads.ts),
# which is dismissed via its native "Close" button back to the Collection tab.
# Dev builds skip the release frequency cap, but closing without a spin never
# shows an ad, so the lever has to be pulled first.
# Read-only apart from the ad itself.
appId: com.korchev.fragrancecollection
tags:
  - ads
---
- runFlow: ../subflows/launch-dev-client.yaml
- runFlow: ../subflows/open-picker.yaml

- swipe:
    from:
      id: "picker-lever"
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: "picker-wear-button"
    timeout: 15000

- tapOn:
    id: "picker-close"

# The interstitial appears shortly after close — Google test creatives all
# carry a "Test Ad" badge that Maestro can see
- extendedWaitUntil:
    visible: "Test Ad"
    timeout: 15000

# Dismissing it lands back on the Collection tab
- runFlow: ../subflows/dismiss-interstitial.yaml
- extendedWaitUntil:
    visible: "Search your collection"
    timeout: 10000
